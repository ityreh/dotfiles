# ~/.config/tmux/tmux.conf
# Reset to omerxx/dotfiles tmux/tmux.conf catppuccin status-bar settings.
# No workmux overrides: status bar is owned entirely by tmux.conf + catppuccin-tmux.

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Options (omerxx/dotfiles)
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g prefix C-a                # use Ctrl-a as prefix instead of Ctrl-b
unbind C-b
bind C-a send-prefix
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g mouse off                 # mouseless: everything via keyboard
set -g focus-events on

# Terminal + colors
set -g default-terminal "tmux-256color"
set -g terminal-overrides ',xterm-256color:RGB'
set -ga terminal-overrides ",*256col*:Tc"

# Vi-style copy mode
setw -g mode-keys vi
set -g status-keys vi

# Borders
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Keybindings (C-b prefix)
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer

# Splits (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-S-Left split-window -h -c "#{pane_current_path}"
bind -n M-S-Down split-window -v -c "#{pane_current_path}"

# Resize with Alt+arrows
bind -n M-Left  resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2

# Maximize / restore pane
bind m resize-pane -Z

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Kill pane without confirm
bind x kill-pane
bind X kill-window

# Smart session/window switching
bind s choose-tree -Zs
bind w choose-window -Z
bind C-s choose-tree -Zs

# New window / session
bind c new-window -c "#{pane_current_path}"
bind n new-session -c "#{pane_current_path}"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Status bar — Catppuccin Mocha via omerxx/catppuccin-tmux
# (transparent: mocha theme sets thm_bg=default in this fork)
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

set -g status on
set -g status-interval 2

set -g @catppuccin_flavour "mocha"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(󰁌),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# TPM + plugins (locally installed)
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/catppuccin-tmux'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep at bottom), then override window formats so the
# window content (name + separators) sits on a dark background with light
# text: current window #1e1e2e, unselected windows #24273a. The number
# chips keep their window-specific color (blue/orange, dark digits) and the
# session block on the left keeps the theme green with red under prefix.
run '~/.tmux/plugins/tpm/tpm'

# tmux 3.7 keeps status-style at its default bg=green,fg=black; the plugin
# only sets the legacy status-bg, which no longer overrides it. Force a
# transparent bar here (after the plugin has run).
set -g status-style "bg=default,fg=default"

setw -g window-status-format "#[fg=#24273a,bg=default,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#24273a]#W#[fg=#89b4fa,bg=#24273a,nobold,nounderscore,noitalics] █#[fg=#1e1e2e,bg=#89b4fa]#I#[fg=#89b4fa,bg=default] "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=default,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#1e1e2e]#W#{?window_zoomed_flag,(󰁌),}#[fg=#fab387,bg=#1e1e2e,nobold,nounderscore,noitalics] █#[fg=#1e1e2e,bg=#fab387]#I#[fg=#fab387,bg=default] "
