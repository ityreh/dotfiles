# Global workmux config — personal defaults for all projects.
# ~/.config/workmux/config.yaml

nerdfont: true

# Default agent for the <agent> placeholder.
agent: opencode

# Worktrees as tmux windows (one task per window).
mode: window
window_placement: after_current

# Default pane layout for new worktrees: nvim focused, shell below.
panes:
  - command: nvim .
    focus: true
  - split: horizontal
    size: 20

# Dashboard theme tuned to Catppuccin Mocha.
theme:
  custom:
    bg: "#1e1e2e"
    fg: "#cdd6f4"
    accent: "#89b4fa"
    success: "#a6e3a1"
    warning: "#f9e2af"
    error: "#f38ba8"

# Do NOT auto-apply agent status icons to tmux window format/catppuccin bar.
# tmux.conf fully owns the status bar.
status_format: false

# status_icons: UNSET on purpose — the sidebar reads this independently of
# status_format, so setting it here replaces the sidebar's fancy defaults:
# working stops being the animated braille spinner and becomes a static icon,
# and the waiting/done glyphs are yours instead of nf-fa-comment / nf-md-check_circle.
# Nerdfont defaults when unset: working = braille spinner, waiting = nf-fa-comment,
# done = nf-md-check_circle, sleeping = nf-md-sleep. Emoji defaults without nerdfont.
# status_icons:
#   waiting: "#[fg=#fab387]󰥷#[fg=default]"
#   done: "#[fg=#a6e3a1]󰦨#[fg=default]"