# starship — Catppuccin Mocha, matching the wezterm/tmux palette.
# Palette: https://github.com/catppuccin/catppuccin

format = """$directory$git_branch$git_status$python$nodejs$rust$c#$cmd_duration$line_break$character"""

[character]
success_symbol = "[\u{e0b0}(bold green)](#1e1e2e)[❯](bold green)"
error_symbol = "[\u{e0b0}(bold red)](#1e1e2e)[❯](bold red)"

[directory]
style = "bold #b4befe"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "  "
style = "bold #89b4fa"
format = "on [$symbol$branch]($style) "

[git_status]
style = "#a6e3a1"
format = "[\\[$all_status$ahead_behind\\]]($style) "

[python]
symbol = "  "
style = "bold #f9e2af"
format = "[${symbol}${version} ]($style)"

[nodejs]
symbol = "  "
style = "bold #a6e3a1"
format = "[${symbol}${version} ]($style)"

[rust]
symbol = "  "
style = "bold #fab387"
format = "[${symbol}${version} ]($style)"

[c]
symbol = "  "
style = "bold #89b4fa"
format = "[${symbol}${version} ]($style)"

[cmd_duration]
min_time = 2000
style = "#bac2de"
format = "[$duration]($style) "